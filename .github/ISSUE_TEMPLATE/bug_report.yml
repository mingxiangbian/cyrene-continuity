name: Bug report
description: Report a reproducible problem with Cyrene Continuity.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, shell, Node.js version, npm version, and Codex version if relevant.
      placeholder: "macOS 15, zsh, Node 22.5.0, npm 10.x, Codex ..."
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Install method
      options:
        - Source checkout with npm run dev
        - Codex plugin install
        - Manual MCP configuration
        - Other
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command or MCP tool call that triggered the issue.
      placeholder: "npm run dev -- codex memory status"
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: logs_output
    attributes:
      label: Logs or output
      description: Redact secrets, .env values, private memory, and full .cyrene data before pasting.
      render: shell
    validations:
      required: false
